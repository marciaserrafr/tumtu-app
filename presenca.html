    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #12101a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 32px 28px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
        }
        .marca {
            text-align: center;
            font-size: 22px;
            color: #12101a;
            margin-bottom: 24px;
        }
        .secao {
            font-size: 20px;
            font-weight: 800;
            color: #12101a;
            margin-bottom: 4px;
        }
        .data-evento {
            font-size: 13px;
            font-weight: 600;
            color: #8b88a0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .subtexto { color: #5a5770; font-size: 14px; line-height: 1.5; margin: 16px 0 20px; }
        .subtexto b { color: #12101a; }
        .btn-acao {
            display: block;
            width: 100%;
            padding: 14px;
            background: #D4AF37;
            color: #12101a;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        .btn-acao:hover { background: #B8922A; }
        .btn-acao:disabled { opacity: 0.6; cursor: default; }
        .carregando { text-align: center; color: #8b88a0; font-size: 15px; padding: 40px 0; }
        .erro { text-align: center; color: #b3261e; font-size: 15px; padding: 24px 0; }
        .sucesso {
            text-align: center;
            color: #2f8f5b;
            font-size: 18px;
            font-weight: 700;
            padding: 20px 0 4px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="marca tt-logo"><span class="tt-t">T</span>u<span class="tt-m">m</span><span class="tt-t">T</span>u</div>
    <div id="conteudo"><div class="carregando">Carregando...</div></div>
</div>

<script>
    const SUPABASE_URL = 'https://pkvzsgrkylrkyzligeim.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrdnpzZ3JreWxya3l6bGlnZWltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2Mjg0NjAsImV4cCI6MjA5ODIwNDQ2MH0.jASGzRUdZWzUwOHDww3XSDPtzw8_JU_OfTCoCpJEWBM';

    const params = new URLSearchParams(window.location.search);
    const eventoId = params.get('e');

    function formatarData(data) {
        if (!data) return '';
        return new Date(data + 'T00:00:00').toLocaleDateString('pt-BR');
    }

    async function carregar() {
        const div = document.getElementById('conteudo');

        if (!eventoId) {
            div.innerHTML = '<div class="erro">QR inválido.</div>';
            return;
        }

        // Espera o supabase-js (script "defer") terminar de carregar antes
        // de usar window.supabase -- sem isso, numa conexão lenta, corre o
        // risco de rodar antes do script existir.
        if (typeof window.supabase === 'undefined') {
            await new Promise((resolve) => window.addEventListener('load', resolve, { once: true }));
        }

        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const { data: sessionData } = await sb.auth.getSession();
        const session = sessionData.session;

        if (!session) {
            const proxima = encodeURIComponent(window.location.pathname + window.location.search);
            div.innerHTML = `
                <div class="secao">Confirmar Presença</div>
                <p class="subtexto">Pra confirmar sua presença, primeiro entre no TumTu.</p>
                <a class="btn-acao" href="login?next=${proxima}">Entrar no TumTu</a>
            `;
            return;
        }

        const hdrs = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${session.access_token}` };

        const [resPessoa, resEvento] = await Promise.all([
            fetch(`${SUPABASE_URL}/rest/v1/pessoas?auth_user_id=eq.${session.user.id}&select=id,nome`, { headers: hdrs }),
            fetch(`${SUPABASE_URL}/rest/v1/eventos?id=eq.${eventoId}&select=id,nome,data,bateria_id,perfis_diretoria_inclusos,iniciado,finalizado`, { headers: hdrs }),
        ]);
        const pessoas = resPessoa.ok ? await resPessoa.json() : [];
        const eventos = resEvento.ok ? await resEvento.json() : [];

        if (!eventos.length) { div.innerHTML = '<div class="erro">Evento não encontrado.</div>'; return; }
        if (!pessoas.length) { div.innerHTML = '<div class="erro">Cadastro não encontrado.</div>'; return; }

        const pessoa = pessoas[0];
        const evento = eventos[0];
        const dataFormatada = formatarData(evento.data);

        const resVinculo = await fetch(`${SUPABASE_URL}/rest/v1/vinculos?pessoa_id=eq.${pessoa.id}&bateria_id=eq.${evento.bateria_id}&select=id,perfil,status`, { headers: hdrs });
        const vinculos = resVinculo.ok ? await resVinculo.json() : [];

        if (!vinculos.length) {
            div.innerHTML = `<div class="secao">${evento.nome}</div>${dataFormatada ? `<div class="data-evento">${dataFormatada}</div>` : ''}<div class="erro">Você não faz parte dessa bateria.</div>`;
            return;
        }
        const vinculo = vinculos[0];

        if (vinculo.status !== 'aprovado') {
            div.innerHTML = `<div class="secao">${evento.nome}</div>${dataFormatada ? `<div class="data-evento">${dataFormatada}</div>` : ''}<div class="erro">Seu cadastro nessa bateria não está ativo.</div>`;
            return;
        }

        const elegivel = vinculo.perfil === 'ritmista' || (evento.perfis_diretoria_inclusos || []).includes(vinculo.perfil);
        if (!elegivel) {
            div.innerHTML = `<div class="secao">${evento.nome}</div>${dataFormatada ? `<div class="data-evento">${dataFormatada}</div>` : ''}<div class="erro">Esse evento não inclui o seu cargo.</div>`;
            return;
        }

        if (!evento.iniciado || evento.finalizado) {
            div.innerHTML = `<div class="secao">${evento.nome}</div>${dataFormatada ? `<div class="data-evento">${dataFormatada}</div>` : ''}<div class="erro">Esse evento não está ativo no momento.</div>`;
            return;
        }

        const resJa = await fetch(`${SUPABASE_URL}/rest/v1/evento_presencas?evento_id=eq.${eventoId}&vinculo_id=eq.${vinculo.id}&select=id`, { headers: hdrs });
        const jaConfirmado = resJa.ok ? await resJa.json() : [];

        if (jaConfirmado.length) {
            div.innerHTML = `
                <div class="secao">${evento.nome}</div>
                ${dataFormatada ? `<div class="data-evento">${dataFormatada}</div>` : ''}
                <div class="sucesso">✓ Presença já confirmada</div>
            `;
            return;
        }

        div.innerHTML = `
            <div class="secao">${evento.nome}</div>
            ${dataFormatada ? `<div class="data-evento">${dataFormatada}</div>` : ''}
            <p class="subtexto">Confirmar presença como <b>${pessoa.nome}</b>?</p>
            <button class="btn-acao" id="btn-confirmar">Confirmar minha presença</button>
        `;

        document.getElementById('btn-confirmar').onclick = async () => {
            const btn = document.getElementById('btn-confirmar');
            btn.disabled = true;
            btn.textContent = 'Confirmando...';
            const resInsert = await fetch(`${SUPABASE_URL}/rest/v1/evento_presencas`, {
                method: 'POST',
                headers: { ...hdrs, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
                body: JSON.stringify({
                    evento_id: Number(eventoId),
                    vinculo_id: vinculo.id,
                    pessoa_id: pessoa.id,
                    bateria_id: evento.bateria_id,
                    confirmado_por: pessoa.id,
                }),
            });
            if (resInsert.ok) {
                div.innerHTML = `
                    <div class="secao">${evento.nome}</div>
                    ${dataFormatada ? `<div class="data-evento">${dataFormatada}</div>` : ''}
                    <div class="sucesso">✓ Presença confirmada!</div>
                `;
            } else {
                btn.disabled = false;
                btn.textContent = 'Confirmar minha presença';
                div.insertAdjacentHTML('beforeend', '<div class="erro">Não consegui confirmar. Tenta de novo.</div>');
            }
        };
    }

    carregar();
</script>
</body>
</html>
