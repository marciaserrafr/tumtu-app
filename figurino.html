<!DOCTYPE html>
<html lang="pt-BR" data-tema="tumtu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TumTu — Confirmar Figurino</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#12101a">
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TumTu">
    <script src="pwa-register.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/tokens.css?v=4">
    <link rel="stylesheet" href="styles/components.css?v=21">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #12101a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 32px 28px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
        }
        .marca {
            text-align: center;
            font-size: 22px;
            color: #12101a;
            margin-bottom: 24px;
        }
        .secao {
            font-size: 20px;
            font-weight: 800;
            color: #12101a;
            margin-bottom: 8px;
        }
        .subtexto { color: #5a5770; font-size: 14px; line-height: 1.5; margin: 16px 0 20px; }
        .subtexto b { color: #12101a; }
        .btn-acao {
            display: block;
            width: 100%;
            padding: 14px;
            background: #D4AF37;
            color: #12101a;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        .btn-acao:hover { background: #B8922A; }
        .btn-acao:disabled { opacity: 0.6; cursor: default; }
        .carregando { text-align: center; color: #8b88a0; font-size: 15px; padding: 40px 0; }
        .erro { text-align: center; color: #b3261e; font-size: 15px; padding: 24px 0; }
        .sucesso {
            text-align: center;
            color: #2f8f5b;
            font-size: 18px;
            font-weight: 700;
            padding: 20px 0 4px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="marca tt-logo"><span class="tt-t">T</span>u<span class="tt-m">m</span><span class="tt-t">T</span>u</div>
    <div id="conteudo"><div class="carregando">Carregando...</div></div>
</div>

<script>
    const SUPABASE_URL = 'https://pkvzsgrkylrkyzligeim.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrdnpzZ3JreWxya3l6bGlnZWltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2Mjg0NjAsImV4cCI6MjA5ODIwNDQ2MH0.jASGzRUdZWzUwOHDww3XSDPtzw8_JU_OfTCoCpJEWBM';

    const params = new URLSearchParams(window.location.search);
    const itemId = params.get('f');

    async function carregar() {
        const div = document.getElementById('conteudo');

        if (!itemId) {
            div.innerHTML = '<div class="erro">QR inválido.</div>';
            return;
        }

        // Espera o supabase-js (script "defer") terminar de carregar antes
        // de usar window.supabase -- numa conexão lenta, evita rodar antes
        // do script existir.
        if (typeof window.supabase === 'undefined') {
            await new Promise((resolve) => window.addEventListener('load', resolve, { once: true }));
        }

        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const { data: sessionData } = await sb.auth.getSession();
        const session = sessionData.session;

        if (!session) {
            const proxima = encodeURIComponent(window.location.pathname + window.location.search);
            div.innerHTML = `
                <div class="secao">Confirmar Figurino</div>
                <p class="subtexto">Pra confirmar que recebeu a peça, primeiro entre no TumTu.</p>
                <a class="btn-acao" href="login?next=${proxima}">Entrar no TumTu</a>
            `;
            return;
        }

        const hdrs = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${session.access_token}` };

        const [resPessoa, resItem] = await Promise.all([
            fetch(`${SUPABASE_URL}/rest/v1/pessoas?auth_user_id=eq.${session.user.id}&select=id,nome`, { headers: hdrs }),
            fetch(`${SUPABASE_URL}/rest/v1/figurino_itens_mestre?id=eq.${itemId}&select=id,nome,publico,ativo`, { headers: hdrs }),
        ]);
        const pessoas = resPessoa.ok ? await resPessoa.json() : [];
        const itens = resItem.ok ? await resItem.json() : [];

        if (!itens.length || !itens[0].ativo) { div.innerHTML = '<div class="erro">Peça não encontrada.</div>'; return; }
        if (!pessoas.length) { div.innerHTML = '<div class="erro">Cadastro não encontrado.</div>'; return; }

        const pessoa = pessoas[0];
        const item = itens[0];

        // A peça não pertence a UMA bateria só (é biblioteca mestre,
        // reaproveitável) -- acha, entre os vínculos aprovados da pessoa,
        // qual bateria tem essa peça ativada E o perfil dela é elegível.
        const resVinculos = await fetch(`${SUPABASE_URL}/rest/v1/vinculos?pessoa_id=eq.${pessoa.id}&status=eq.aprovado&select=id,perfil,bateria_id`, { headers: hdrs });
        const vinculos = resVinculos.ok ? await resVinculos.json() : [];
        const vinculosElegiveis = vinculos.filter(v => item.publico.includes(v.perfil));

        if (!vinculosElegiveis.length) {
            div.innerHTML = `<div class="secao">${item.nome}</div><div class="erro">Essa peça não é do seu cargo.</div>`;
            return;
        }

        const bateriaIds = vinculosElegiveis.map(v => v.bateria_id);
        const resAtivas = await fetch(`${SUPABASE_URL}/rest/v1/bateria_figurino_itens?figurino_item_mestre_id=eq.${itemId}&bateria_id=in.(${bateriaIds.join(',')})&ativo=eq.true&select=bateria_id`, { headers: hdrs });
        const ativas = resAtivas.ok ? await resAtivas.json() : [];
        const bateriaIdsAtivas = new Set(ativas.map(a => a.bateria_id));
        const vinculo = vinculosElegiveis.find(v => bateriaIdsAtivas.has(v.bateria_id));

        if (!vinculo) {
            div.innerHTML = `<div class="secao">${item.nome}</div><div class="erro">Essa peça não está disponível na sua bateria.</div>`;
            return;
        }

        const resJa = await fetch(`${SUPABASE_URL}/rest/v1/figurino_entregas?figurino_item_id=eq.${itemId}&vinculo_id=eq.${vinculo.id}&entregue_em=not.is.null&select=id`, { headers: hdrs });
        const jaConfirmado = resJa.ok ? await resJa.json() : [];

        if (jaConfirmado.length) {
            div.innerHTML = `
                <div class="secao">${item.nome}</div>
                <div class="sucesso">✓ Já confirmado que recebeu</div>
            `;
            return;
        }

        div.innerHTML = `
            <div class="secao">${item.nome}</div>
            <p class="subtexto">Confirmar que <b>${pessoa.nome}</b> recebeu essa peça?</p>
            <button class="btn-acao" id="btn-confirmar">Confirmar recebimento</button>
        `;

        document.getElementById('btn-confirmar').onclick = async () => {
            const btn = document.getElementById('btn-confirmar');
            btn.disabled = true;
            btn.textContent = 'Confirmando...';
            const resInsert = await fetch(`${SUPABASE_URL}/rest/v1/figurino_entregas`, {
                method: 'POST',
                headers: { ...hdrs, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
                body: JSON.stringify({
                    figurino_item_id: Number(itemId),
                    vinculo_id: vinculo.id,
                    entregue_em: new Date().toISOString(),
                    confirmado_por: pessoa.id,
                }),
            });
            if (resInsert.ok) {
                div.innerHTML = `
                    <div class="secao">${item.nome}</div>
                    <div class="sucesso">✓ Recebimento confirmado!</div>
                `;
            } else {
                btn.disabled = false;
                btn.textContent = 'Confirmar recebimento';
                div.insertAdjacentHTML('beforeend', '<div class="erro">Não consegui confirmar. Tenta de novo.</div>');
            }
        };
    }

    carregar();
</script>
</body>
</html>
